# Phase 4C.2 Stage 2 Fine-Tuning Execution & Preregistration Configuration
# Formal Preregistration for Partial Backbone Unfreezing Experiment
# Derived from Pilot A learning curve outcomes (Phase 4C.1D.2 canonical evidence commit f6eb57d)

schema_version: "1.0.0"
config_id: "phase_4c2_stage2_finetuning"
pilot_id: "pilot_tgif_edit"
pilot_branch: "Pilot A"
title: "Phase 4C.2 Stage 2 Fine-Tuning: Partial Backbone Unfreezing (Option P, N=50,100,250)"
scientific_status: "preregistered_protocol"
license_track: "research-only"
treatment_designation: "pre-registered partial fine-tuning protocol"
treatment_justification: "Designated as 'pre-registered partial fine-tuning protocol' (and not 'pure isolated unfreezing effect') because differential learning rates, lowered head learning rate (5e-4 vs 1e-3), bounded epochs (20 vs 25), and gradient clipping (1.0 vs None) are jointly pre-registered to ensure optimization stability during convolution block unfreezing."

independent_statistical_unit: "source_id"
enforce_source_isolation: true
forbid_masks_as_independent_samples: true
no_fr_to_fully_generated: true

stage_1_parent_evidence:
  parent_phase: "Phase 4C.1D.2"
  parent_commit_sha: "f6eb57df121dbfc908ec1731d55bbe3c87dc5453"
  evidence_directory: "research/evidence/phase-4c.1d/"
  baseline_metrics:
    n50_macro_f1: 0.5322
    n100_macro_f1: 0.5728
    n250_macro_f1: 0.5627
    n100_minus_n50_delta: 0.0406
    n250_minus_n100_delta: -0.0101
  linear_probe_conclusion: "Plateau at N=100 in frozen configuration; justifies testing partial unfreezing hypothesis without proving bottleneck in advance."

dataset_binding:
