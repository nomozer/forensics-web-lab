initialization_contract:
  policy: "from_pretrained_backbone_with_fresh_head"
  description: "Stage 1 and Stage 2 start from identical torchvision ImageNet pretrained weights and model construction code, with fresh seeded head initialization. Best Stage 1 checkpoint is NOT loaded."
  pretrained_weights_identifier: "MobileNet_V3_Small_Weights.DEFAULT"
  pretrained_weights_enum: "torchvision.models.MobileNet_V3_Small_Weights.IMAGENET1K_V1"
  pretrained_weights_source_url: "https://download.pytorch.org/models/mobilenet_v3_small-047dcff4.pth"
  pretrained_weights_file_sha256: "047dcff4addef86ea5bc2eff13c9614dc11f47ab1160d0a71a25e7db994f4e1f"
  pretrained_weights_state_fingerprint: "3adfbce13df024027cd59bfe2370aed39563091eec20fc14cdf58f4c48bc08ca"
  parent_checkpoint_path: null
  parent_checkpoint_hash: null
  classifier_initialization_evidence: "seeded_torch_init_at_model_creation"

intervention_definition:
  control_group:
    name: "Stage 1 (Frozen Backbone Linear Probe)"
    state: "Completed 15 canonical runs on Colab T4"
    trainable_modules: ["classifier"]
    trainable_parameters: 148226
  treatment_group:
    name: "Stage 2 (Partial Fine-Tuning: Head + Last Convolution Block)"
    description: "Unfreeze classifier head and features.12 (Conv2dNormActivation: 1x1 conv + batchnorm) with differential learning rates"
    architecture: "MobileNetV3Forensics(num_classes=2)"
    unfrozen_modules:
      - "features.12"
      - "classifier"
    frozen_modules:
      - "features.0"
      - "features.1"
      - "features.2"
      - "features.3"
      - "features.4"
      - "features.5"
      - "features.6"
      - "features.7"
      - "features.8"
      - "features.9"
      - "features.10"
      - "features.11"
    trainable_parameter_allowlist:
      - name: "features.12.0.weight"
        shape: [576, 96, 1, 1]
        numel: 55296
      - name: "features.12.1.weight"
        shape: [576]
        numel: 576
      - name: "features.12.1.bias"
        shape: [576]
        numel: 576
      - name: "classifier.0.weight"
        shape: [256, 576]
        numel: 147456
      - name: "classifier.0.bias"
        shape: [256]
        numel: 256
      - name: "classifier.3.weight"
        shape: [2, 256]
        numel: 512
      - name: "classifier.3.bias"
        shape: [2]
        numel: 2
    parameter_accounting:
      trainable_parameters: 204674
      frozen_parameters: 870560
      total_parameters: 1075234
      trainable_percentage: 19.035
    batchnorm_policy:
      frozen_features_eval: true
      reapply_after_train: true
      unfrozen_features_12_bn_train: true
      rule: "BatchNorm in features.0-11 strictly kept in eval mode via apply_frozen_bn_policy() after every model.train() call. Buffers running_mean, running_var, and num_batches_tracked remain immutable."
    invariance_constraint: "No simultaneous modification of architecture, dataset, augmentation, or loss function. Only partial unfreezing, differential learning rates, lowered head learning rate, bounded epochs, and gradient clipping are evaluated under the registered protocol."

hyperparameters:
  optimizer: "AdamW"
  learning_rate_backbone: 0.00005
  learning_rate_head: 0.0005
  weight_decay: 0.0001
  scheduler: "CosineAnnealingLR"
  scheduler_params:
    T_max: 20
    eta_min: 0.000001
  batch_size: 32
  max_epochs: 20
  early_stopping_patience: 5
  early_stopping_delta: 0.001
  primary_checkpoint_metric: "inner_val_macro_f1"
  gradient_clipping_max_norm: 1.0
  loss_function: "FocalLoss"
  loss_params:
    alpha: null
    gamma: 2.0
    label_smoothing: 0.05
    reduction: "mean"
  mixed_precision: "fp32"
  preprocessing:
    input_size: [224, 224]
    normalize_mean: [0.485, 0.456, 0.406]
    normalize_std: [0.229, 0.224, 0.225]
    interpolation: "bicubic"
  augmentation: "none_canonical_deterministic"
  deterministic_settings:
    torch_deterministic: true
    cudnn_benchmark: false
    pythonhashseed: 0
    stable_offset_algorithm: "sha256_64bit_integer"
  gpu_policy:
    policy: "compatible"
    min_vram_gb: 8.0
    hardcode_t4_only: false
    supported_architectures:
      - "Tesla T4"
      - "NVIDIA L4"
      - "Tesla V100"
      - "NVIDIA A100"
      - "CUDA_COMPATIBLE_GENERIC"

