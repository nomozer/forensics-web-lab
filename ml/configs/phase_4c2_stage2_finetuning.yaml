intervention_definition:
  control_group:
    name: "Stage 1 (Frozen Backbone Linear Probe)"
    state: "Completed 15 canonical runs on Colab T4"
    trainable_modules: ["classifier"]
    trainable_parameters: 148226
  treatment_group:
    name: "Stage 2 (Partial Fine-Tuning: Head + Last Convolution Block)"
    description: "Unfreeze classifier head and features.12 (Conv2dNormActivation: 1x1 conv + batchnorm) with differential learning rates"
    architecture: "MobileNetV3Forensics(num_classes=2)"
    unfrozen_modules:
      - "features.12"
      - "classifier"
    frozen_modules:
      - "features.0"
      - "features.1"
      - "features.2"
      - "features.3"
      - "features.4"
      - "features.5"
      - "features.6"
      - "features.7"
      - "features.8"
      - "features.9"
      - "features.10"
      - "features.11"
    trainable_parameter_allowlist:
      - name: "features.12.0.weight"
        shape: [576, 96, 1, 1]
        numel: 55296
      - name: "features.12.1.weight"
        shape: [576]
        numel: 576
      - name: "features.12.1.bias"
        shape: [576]
        numel: 576
      - name: "classifier.0.weight"
        shape: [256, 576]
        numel: 147456
      - name: "classifier.0.bias"
        shape: [256]
        numel: 256
      - name: "classifier.3.weight"
        shape: [2, 256]
        numel: 512
      - name: "classifier.3.bias"
        shape: [2]
        numel: 2
    parameter_accounting:
      trainable_parameters: 204674
      frozen_parameters: 870560
      total_parameters: 1075234
      trainable_percentage: 19.035
    invariance_constraint: "No simultaneous modification of architecture, dataset, augmentation, or loss function. Only partial unfreezing and differential learning rate are evaluated."

hyperparameters:
  optimizer: "AdamW"
  learning_rate_backbone: 0.00005
  learning_rate_head: 0.0005
  weight_decay: 0.0001
  scheduler: "CosineAnnealingLR"
  scheduler_params:
    T_max: 20
    eta_min: 0.000001
  batch_size: 32
  max_epochs: 20
  early_stopping_patience: 5
  primary_checkpoint_metric: "inner_val_macro_f1"
  gradient_clipping_max_norm: 1.0
  loss_function: "FocalLoss"
  loss_params:
    gamma: 2.0
    label_smoothing: 0.05
    reduction: "mean"
  mixed_precision: "fp32"
  preprocessing:
    input_size: [224, 224]
    normalize_mean: [0.485, 0.456, 0.406]
    normalize_std: [0.229, 0.224, 0.225]
    interpolation: "bicubic"
  augmentation: "none_canonical_deterministic"
  deterministic_settings:
    torch_deterministic: true
    cudnn_benchmark: false
    pythonhashseed: 0
    stable_offset_algorithm: "sha256_64bit_integer"
  gpu_policy:
    policy: "compatible"
    min_vram_gb: 8.0
    hardcode_t4_only: false
    supported_architectures:
      - "Tesla T4"
      - "NVIDIA L4"
      - "Tesla V100"
      - "NVIDIA A100"
      - "CUDA_COMPATIBLE_GENERIC"

experiment_matrix:
  sample_sizes:
    - n_sources: 50
      status: "runnable"
      cohort_dev_samples: 100
      cohort_val_samples: 182
    - n_sources: 100
      status: "runnable"
      cohort_dev_samples: 200
      cohort_val_samples: 182
    - n_sources: 250
      status: "runnable"
      cohort_dev_samples: 500
