  random_seeds: [42, 1337, 2025, 3407, 9001]
  total_runs: 15
  pairing_structure: "Strict 1-to-1 paired comparison with Stage 1 on identical (N, seed) cell"
  tuning_restriction: "Strictly forbid exploratory hyperparameter adjustments on individual seeds prior to batch execution"

preregistered_analysis_plan:
  primary_endpoint:
    id: "paired_delta_macro_f1"
    definition: "Stage 2 Macro-F1 minus Stage 1 Macro-F1 evaluated on the identical 91 inner_validation sources"
  secondary_endpoints:
    - "balanced_accuracy"
    - "auroc"
    - "runner_reported_validation_loss"
    - "brier_score"
    - "ece"
    - "training_time_seconds"
    - "peak_vram_mb"
  statistical_testing:
    summary_reporting: "Mean, standard deviation, and 95% confidence interval (t-distribution df=4) per sample size N"
    paired_seed_analysis: "Paired difference per seed across 5 matched seeds"
    paired_t_test_designation: "exploratory"
    permutation_test:
      type: "exact_two_sided_sign_flip"
      resolution_limit: 0.0625
      caveat: "With n=5, minimum resolution is 2/32 = 0.0625; mathematically cannot achieve alpha < 0.05 despite unanimous 5/5 positive direction"
    multiple_testing_correction: "Holm-Bonferroni correction across the 3 registered sample sizes (N=50, 100, 250)"
  calibration_protocol:
    temperature_scaling: "Option to evaluate on an independent calibration split or via nested cross-fitting"
    data_leakage_guard: "Forbidden to fit temperature parameter on model selection data and report calibration on the same data"
    miscalibration_diagnosis: "Reliability diagram or signed calibration error required before asserting overconfidence vs underconfidence"

