  prohibit_new_dataset_generation: true

namespace_isolation:
  drive_output_root: "MyDrive/Colab Notebooks/forensics-web-lab/phase_4c2/"
  local_artifact_root: "D:\\Documents\\forensics-web-lab-local-artifacts\\phase_4c2\\"
  forbidden_output_targets:
