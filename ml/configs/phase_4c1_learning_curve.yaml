execution_gate:
  requires_explicit_approval: true
  smoke_run_first: true
  smoke_run_config:
    n_sources: 50
    seed: 42
    stage: 1
  stage_2_gate:
    requires_stage_1_superior_to_dummy: true
    requires_stage_1_superior_to_metadata: true
  locked_test_evaluations: 0
  locked_test_seal: "519e7a0e6815e781d1cefa95971e5221ac1f25656837374d8dc4ba41401fded9"